<body data-layout="public" data-active="track" data-title="ติดตามสถานะ">
<div id="wp-page">
<div class="card reveal mb2">
  <div class="card-h"><span class="ch-ic"><i class="fa-solid fa-list-check ic-bob"></i></span><h3>สถานะใบอนุญาตล่าสุด</h3><span class="spacer"></span><small class="muted">60 วันล่าสุด · อัปเดตอัตโนมัติ</small></div>
  <div class="tbl-wrap" style="border:0"><table class="tbl"><thead><tr><th>เลขที่ใบอนุญาต</th><th>ผู้รับเหมา</th><th>งานที่เปิด</th><th>วันที่ทำงาน</th><th>สถานะ / ค้างอยู่ที่</th></tr></thead><tbody id="tl-body">
    <tr><td colspan="5"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>กำลังโหลดข้อมูล...</div></td></tr>
  </tbody></table></div>
</div>
<div class="login-wrap" style="min-height:0;margin-top:100px">
  <div class="card login-card glow-border always reveal" style="max-width:520px">
    <div class="shield"><i class="fa-solid fa-magnifying-glass-location"></i></div>
    <h1>ติดตามสถานะใบอนุญาต</h1>
    <p>ดูรายละเอียดเต็มของใบ: กรอกเลขที่ใบอนุญาต และเบอร์โทรศัพท์ผู้ขออนุญาต</p>
    <div class="alert err mb2 hide" id="nf"><i class="fa-solid fa-circle-exclamation"></i><div>ไม่พบใบอนุญาตที่ต้องการ</div></div>
    <form id="tf">
      <div class="field"><label>เลขที่ใบอนุญาต</label><div class="input-ic"><input class="input" name="permit_no" required placeholder="WP-YYYYMMDD-001" style="text-transform:uppercase"><i class="fa-solid fa-hashtag"></i></div></div>
      <div class="field"><label>เบอร์โทรศัพท์ผู้ขออนุญาต</label><div class="input-ic"><input class="input" name="phone" required inputmode="tel" placeholder="08x-xxx-xxxx"><i class="fa-solid fa-phone"></i></div></div>
      <button class="btn lg w100 mt1"><i class="fa-solid fa-magnifying-glass"></i> ค้นหา</button>
    </form>
  </div>
</div>
</div>
