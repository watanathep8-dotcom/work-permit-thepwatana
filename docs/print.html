<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบขออนุญาตปฏิบัติงาน</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b2a1a; font-family: 'Sarabun', 'Leelawadee UI', Tahoma, sans-serif; font-size: 11px; color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar { position: sticky; top: 0; display: flex; gap: 10px; justify-content: center; padding: 12px; background: #04170e; z-index: 5; }
  .bar button, .bar a { font: 600 14px 'Sarabun'; padding: 9px 18px; border-radius: 10px; border: 0; cursor: pointer; background: linear-gradient(135deg, #059669, #a3e635); color: #00220f; text-decoration: none; }
  .bar a { background: #1e3a2c; color: #d1fae5; }
  .page { width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff; padding: 10mm; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .page + .page { break-before: page; page-break-before: always; }
  .fit { width: 190mm; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border: 1px solid #333; padding: 3px 5px; vertical-align: top; }
  .head td { vertical-align: middle; }
  .title { text-align: center; font-size: 16px; font-weight: 700; line-height: 1.25; }
  .co { font-weight: 600; font-size: 12px; }
  .sec { background: #0f5132; color: #fff; font-weight: 700; padding: 2px 6px; }
  .sec .cb { border-color: #fff; background: #fff; }
  .sec .cb.on { color: #0f5132; }
  .sec-note { font-weight: 400; font-size: 10px; }
  .sub { background: #d1fae5; font-weight: 700; }
  .cb { display: inline-block; width: 11px; height: 11px; border: 1px solid #222; vertical-align: -2px; text-align: center; line-height: 9px; font-size: 10px; font-weight: 700; }
  .cb.on { background: #0f5132; color: #fff; border-color: #0f5132; }
  .wts { display: flex; gap: 10px; align-items: flex-start; }
  .wt-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px 14px; }
  .lines { line-height: 1.7; }
  table.cl > tbody > tr > td, table.cl > tr > td { padding: 0; }
  .blk + .blk { border-top: 1px solid #333; }
  .body { padding: 2px 6px 3px; }
  .body.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .it { margin: 0; line-height: 1.4; }
  .it.half { display: inline-block; width: 49%; vertical-align: top; }
  .it.legacy { color: #444; font-style: italic; }
  .it.files { color: #333; font-size: 10px; padding-left: 14px; word-break: break-all; }
  .grp { font-weight: 600; margin-top: 2px; }
  .ppe { display: grid; grid-template-columns: repeat(3, auto); gap: 0 10px; padding-left: 10px; margin-bottom: 1px; line-height: 1.4; }
  .ppe .oth { grid-column: span 2; }
  u.fill { text-decoration: none; border-bottom: 1px dotted #555; padding: 0 3px; min-width: 60px; display: inline-block; color: #0b2a6b; font-weight: 600; }
  .val { color: #0b2a6b; font-weight: 600; }
  .loto { border-top: 1px solid #333; }
  .loto td, .loto th { border-left: 0; border-bottom: 0; height: 17px; padding: 1px 4px; font-size: 10.5px; }
  .loto tr > :last-child { border-right: 0; }
  .appr { margin-top: 4px; }
  .appr .stmt { font-size: 10.5px; line-height: 1.5; }
  .appr td { height: 46px; font-size: 10.5px; }
  .appr .role { vertical-align: middle; font-weight: 600; white-space: nowrap; }
  .appr .at { font-size: 9.5px; color: #333; }
  .appr .sig { height: 26px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .cols > div { padding: 4px 6px; }
  .cols > div:first-child { border-right: 1px solid #333; }
  .wt-off { opacity: .5; }
  .sig { height: 40px; max-width: 150px; object-fit: contain; display: block; margin: 0 auto; }
  .center { text-align: center; }
  .small { font-size: 10px; }
  .code { text-align: right; font-size: 10px; margin-top: 3px; }
  .stamp { position: absolute; top: 34mm; right: 14mm; transform: rotate(-14deg); border: 3px solid; border-radius: 10px; padding: 4px 14px; font-size: 20px; font-weight: 700; opacity: .75; z-index: 2; background: rgba(255,255,255,.6); }
  .stamp.approved, .stamp.closed { color: #047857; } .stamp.pending { color: #b45309; } .stamp.rejected { color: #b91c1c; } .stamp.expired { color: #64748b; }
  .no { font-weight: 700; font-size: 12.5px; color: #0f5132; }
  ol { margin: 3px 0; padding-left: 18px; } li { margin-bottom: 2px; line-height: 1.5; }
  .notes td { font-size: 11px; }
  .rules td { font-size: 11.5px; }
  .rules .grp { margin-top: 8px; }
  .ack { margin: 14px 0 6px; font-weight: 600; }
  .signl { text-align: center; margin-top: 18px; line-height: 1.8; }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .page { margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 0; }
    .stamp { top: 24mm; right: 4mm; }
  }
</style></head><body>
<div class="bar"><button onclick="print()">🖨️ พิมพ์ / บันทึก PDF</button><a href="javascript:history.back()">← กลับ</a></div>
<div id="print-root"><div class="page" style="min-height:auto;text-align:center;font-size:16px">กำลังโหลดข้อมูล...</div></div>
<script src="config.js"></script>
<script src="assets/js/data.js?v=10"></script>
<script src="assets/js/core.js?v=6"></script>
<script src="assets/js/parts.js?v=10"></script>
<script src="assets/js/pages/print.js?v=7"></script>
</body></html>
