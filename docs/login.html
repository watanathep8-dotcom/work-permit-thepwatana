<body data-layout="public" data-active="" data-title="เข้าสู่ระบบ">
<div id="wp-page">
<div class="login-wrap">
  <form method="post" class="card login-card glow-border always reveal" id="login-form">
    <div class="shield"><i class="fa-solid fa-user-shield"></i></div>
    <h1>สำหรับ จป. / ผู้อนุมัติ</h1>
    <p>เข้าสู่ระบบเพื่อพิจารณาอนุมัติใบขออนุญาตปฏิบัติงาน (จป. · ผู้รับผิดชอบงาน · เจ้าของพื้นที่)</p>
    <div class="alert err mb2 hide" id="err"><i class="fa-solid fa-triangle-exclamation"></i><div id="err-msg"></div></div>
    <div class="field"><label>ชื่อผู้ใช้</label><div class="input-ic"><input class="input" name="username" required autofocus autocomplete="username"><i class="fa-solid fa-user"></i></div></div>
    <div class="field"><label>รหัสผ่าน</label><div class="input-ic"><input class="input" type="password" name="password" required autocomplete="current-password"><i class="fa-solid fa-lock"></i></div></div>
    <button class="btn lg w100 mt1"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>
  </form>
</div>
</div>
<script src="config.js"></script>

</html>
